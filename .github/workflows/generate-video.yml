name: Generate Stickman Video
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic'
        required: true
        default: 'Un chat qui apprend a danser'
      style:
        description: 'Style B1 B2 B3 or B4'
        required: false
        default: 'B1'
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generate video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/autopilot.mjs --topic "${{ inputs.topic }}" --style "${{ inputs.style }}"
      - uses: actions/upload-artifact@v4
        with:
          name: video-finale
          path: out/
