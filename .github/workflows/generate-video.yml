name: Generate Stickman Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Sujet de la vidéo'
        required: true
        default: 'Un chat qui apprend à danser'
      style:
        description: 'Style B1 B2 B3 ou B4'
        required: false
        default: 'B1'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Installer les dépendances
        run: npm install

      - name: Vérifier le setup
        run: node scripts/autopilot.mjs doctor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Générer la vidéo
        run: node scripts/autopilot.mjs run --topic "${{ inputs.topic }}" --style "${{ inputs.style }}" --auto
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Sauvegarder la vidéo
        uses: actions/upload-artifact@v4
        with:
          name: video-finale
          path: output/
